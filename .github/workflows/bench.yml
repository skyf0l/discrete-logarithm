name: Benchmarks

# - Pull requests:
#   - the base branch and the PR are measured in the same job, the comparison is written to
#     the job summary, and the job fails on an instruction count regression (exact);
#   - one PR comment with the comparison, worst changes first (updated on each push);
#   - github-action-benchmark compares with the last main results stored on gh-pages, in the
#     job summary.
# - Pushes to main: github-action-benchmark stores the results on the gh-pages branch, draws
#   the history charts, and comments on the commit on regressions.

# Only when the measured code can change.
on:
  push:
    branches: [main]
    paths: &paths
    - 'src/**'
    - 'benches/**'
    - 'Cargo.toml'
    - 'Cargo.lock'
    # Renovate updates (GitHub Actions, config) are benchmarked like dependency updates.
    - '.github/**'
  pull_request:
    branches: [main]
    paths: *paths

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  # Instruction counts do not depend on parallelism.
  GUNGRAUN_PARALLEL: auto

jobs:
  instructions:
    name: Instruction counts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Halves the build time of the benchmarks (built twice, base and PR); debug info does not
      # change the instruction counts.
      CARGO_PROFILE_BENCH_DEBUG: 'false'
    outputs:
      # Results were uploaded (even with regressions): the report job can run.
      uploaded: ${{ steps.upload.outcome == 'success' }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@stable
    - uses: swatinem/rust-cache@v2

    - name: Install Valgrind
      run: sudo apt-get update && sudo apt-get install -y valgrind

    - name: Get gungraun version
      id: gungraun
      run: |
        version=$(cargo metadata --locked --format-version 1 \
          | jq -r '.packages[] | select(.name == "gungraun") | .version')
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: taiki-e/install-action@v2
      with:
        tool: gungraun-runner@${{ steps.gungraun.outputs.version }}

    # Never compare against results restored from the cache.
    - name: Clean previous results
      run: rm -rf target/gungraun

    - name: Benchmark base branch
      if: github.event_name == 'pull_request'
      run: |
        git checkout ${{ github.event.pull_request.base.sha }}
        if [ -f benches/ops.rs ]; then
          .github/scripts/install-gungraun-runner.sh
          cargo bench --locked --features bench --bench ops --bench e2e -- --save-baseline=base
        else
          echo "No benchmarks on the base branch: nothing to compare with."
        fi
        git checkout ${{ github.sha }}
        # Back to the runner version of the PR, if the base branch used another one.
        .github/scripts/install-gungraun-runner.sh

    # Regressions (exit code 3) don't stop the job: results are still uploaded and reported on
    # the PR, and the job fails in its last step. Any other error fails immediately.
    - name: Benchmark
      id: bench
      run: |
        set -o pipefail
        args=(--save-summary=json)
        if [ "${{ github.event_name }}" = pull_request ]; then
          args+=(--baseline=base --callgrind-limits='ir=2%')
        fi
        echo '## Instruction counts' >> "$GITHUB_STEP_SUMMARY"
        regressed=false
        # One bench at a time: cargo stops at the first failing bench target.
        for bench in e2e ops; do
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          status=0
          cargo bench --locked --features bench --bench "$bench" -- "${args[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          case $status in
            0) ;;
            3) regressed=true ;;
            *) exit "$status" ;;
          esac
        done
        echo "regressed=$regressed" >> "$GITHUB_OUTPUT"

    - name: Convert results
      run: .github/scripts/gungraun-to-benchmark.sh > instructions.json

    - name: Build PR comment
      if: github.event_name == 'pull_request'
      run: .github/scripts/gungraun-comment.sh target/gungraun 2 0.5 > instructions.md

    - uses: actions/upload-artifact@v7
      id: upload
      with:
        name: instructions
        path: |
          instructions.json
          instructions.md

    - name: Fail on regressions
      if: steps.bench.outputs.regressed == 'true'
      run: |
        echo "::error::Instruction count regressions over the 2% limit, see the job summary or the PR comment"
        exit 1

  # Compares with the last results stored on gh-pages (from main) and, on main, stores the new
  # results there.
  report:
    name: Report results
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [instructions]
    # Also runs when the instructions job failed on regressions, as long as its results were
    # uploaded. Fork PRs get a read-only token: they can't comment, the job summary above
    # still works.
    if: >-
      !cancelled() &&
      needs.instructions.outputs.uploaded == 'true' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      # Push to gh-pages and commit comments (main).
      contents: write
      # Comparison comment on PRs.
      pull-requests: write

    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: instructions
        path: instructions

    # One PR comment, worst changes first and unchanged benchmarks collapsed (the action's own
    # comment lists everything by name).
    - name: Build PR comment
      if: github.event_name == 'pull_request'
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: .github/scripts/bench-comment.sh > "$RUNNER_TEMP/comment.md"

    # Creates the comment, or updates the one with the same header on the next pushes.
    - uses: marocchino/sticky-pull-request-comment@v3
      if: github.event_name == 'pull_request'
      with:
        header: benchmarks
        path: ${{ runner.temp }}/comment.md

    - uses: benchmark-action/github-action-benchmark@v1
      with:
        name: Instruction counts
        tool: customSmallerIsBetter
        output-file-path: instructions/instructions.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # Only results from main are stored (pushed), PRs are only compared. The action always
        # commits to a local gh-pages branch, only the push depends on this.
        auto-push: ${{ github.event_name == 'push' }}
        # Instruction counts are deterministic: any significant increase is real.
        alert-threshold: '102%'
        # PRs get our own comment (above): alert comments only on main.
        comment-on-alert: ${{ github.event_name == 'push' }}
        summary-always: true
